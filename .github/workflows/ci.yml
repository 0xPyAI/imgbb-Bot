name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # A throwaway database for tests/test_db.py
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Validate Python Compilation
        run: |
          python -m compileall -q .

      # tests/conftest.py supplies dummy settings, so no secrets are needed
      - name: Run Test Suite
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_test
        run: |
          python -m pytest tests/ -v

      - name: Audit Dependencies
        if: matrix.python-version == '3.11'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Image
        run: |
          docker build -t pyrogram-imgbb-bot:ci .

      # Same read-only root file system as docker-compose.yml; dummy settings
      # are enough because importing never connects to Telegram or the database
      - name: Check Image Imports
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -e API_ID=12345 -e API_HASH=0123456789abcdef0123456789abcdef \
            -e BOT_TOKEN=123456:CI-TOKEN \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci \
            pyrogram-imgbb-bot:ci \
            python -c "import sys; sys.path.insert(0, '/app'); import tgcrypto, commands, pyro; print('image ok')"
